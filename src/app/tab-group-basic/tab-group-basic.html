<mat-tab-group [class.mat-bg-primary] animationDuration="5000ms">
    <!-- ======================================== Subjet1 ======================================== -->
    <mat-tab [class.tabs-overrides] >        
        <ng-template mat-tab-label>
            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon>
            {{subjectDB}} 
        </ng-template>        
        <ng-template matTabContent>      
            <mat-tab-group>
                <mat-tab label={{subjectFDB}}>
                    <ng-template matTabContent>
                        <mat-grid-list cols="4" rowHeight="100px">
                        @for (tile of tiles.getTiles(); track tile) {
                            <mat-grid-tile
                                [colspan]="tile.cols"
                                [rowspan]="tile.rows"
                                [style.background]="tile.color">
                                    {{tile.text}}                        
                            </mat-grid-tile>
                        }
                        </mat-grid-list>   
                    </ng-template>                                        
                </mat-tab>
                <mat-tab label={{subjectDBD}}>
                    <ng-template matTabContent>
                        Content 2
                    </ng-template>                       
                </mat-tab>
                <mat-tab label={{subjectAMDB}}>
                    <ng-template matTabContent>
                        Content 3
                    </ng-template>                       
                </mat-tab>                
            </mat-tab-group>               
        </ng-template>
    </mat-tab>    
    <!-- ======================================== Subjet2 ======================================== -->
    <mat-tab [class.tabs-overrides] label={{subjectP}}>
        <ng-template matTabContent>
            Content 2
        </ng-template>        
    </mat-tab>  
    <!-- ======================================== Subje3 ======================================== -->  
    <mat-tab [class.tabs-overrides] label={{subjectSW}}>
        <ng-template matTabContent>
            Content 3
        </ng-template>
    </mat-tab>
    <!-- ======================================== Subjet4 ======================================== -->    
    <mat-tab [class.tabs-overrides] label={{subjectSy}}>
        <ng-template matTabContent>
            Content 4
    </ng-template>        
    </mat-tab>    
</mat-tab-group>
