<mat-tab-group [class.mat-bg-primary] animationDuration="5000ms">
    <!-- ======================================== Subjet1 ======================================== -->
    <mat-tab [class.tabs-overrides] >        
        <ng-template mat-tab-label>
            <!-- <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon> -->
            <img src="/css/images/db.svg" alt="foodJpg">
            {{subjectDB}} 
        </ng-template>        
        <ng-template matTabContent>      
            <mat-tab-group>
                <mat-tab label={{subjectFDB}}>
                    <ng-template matTabContent>
                        <mat-grid-list cols="4">
                            <mat-grid-tile                                
                                [colspan]=tiles.getTiles()[3].cols
                                [rowspan]=tiles.getTiles()[3].rows
                                [style.background]=tiles.getTiles()[3].color >
                                <mat-card-content>
                                    <app-table-contents></app-table-contents>
                                </mat-card-content>
                            </mat-grid-tile>
                            <mat-grid-tile
                                [colspan]=tiles.getTiles()[4].cols
                                [rowspan]=tiles.getTiles()[4].rows
                                [style.background]=tiles.getTiles()[4].color >

                                <mat-card class="card" appearance="raised">
                                    <mat-card-header>
                                        <div mat-card-avatar class="example-header-image"></div>
                                        <mat-card-title>Simple query</mat-card-title>
                                        <mat-card-subtitle>Column Arithmetics</mat-card-subtitle>
                                    </mat-card-header>
                                    <!-- <img class="card-image" mat-card-image src="https://material.angular.dev/assets/img/examples/shiba2.jpg" alt="Photo of a Shiba Inu"> -->
                                    <mat-card-content>
                                        <div>
                                        <p class="sql">
                                            <code>
                                                <span class="sqlui capitalize">selet</span> 
                                                count(*) Amount_teachers, Subjects, sfkjdf dlfkajsdfksd dflkdjfk  <br/>
                                                <span class="sqlui capitalize">from</span> 
                                                teachers t <br/>
                                                <span class="sqlui capitalize">group by</span>
                                                id_t
                                            </code>                                            
                                        </p>
                                            
                                        </div>                                                                           
                                    </mat-card-content>
                                </mat-card>

                            </mat-grid-tile>

                        <!-- @for (tile of tiles.getTiles(); track tile) {
                            <mat-grid-tile
                                [colspan]="tile.cols"
                                [rowspan]="tile.rows"
                                [style.background]="tile.color">
                                    {{tile.text}}                        
                            </mat-grid-tile>
                        } -->

                            
                        </mat-grid-list>                        
                    </ng-template>                                        
                </mat-tab>
                <mat-tab label={{subjectDBD}}>
                    <ng-template matTabContent>
                        Content 2
                    </ng-template>                       
                </mat-tab>
                <mat-tab label={{subjectAMDB}}>
                    <ng-template matTabContent>
                        Content 3
                    </ng-template>                       
                </mat-tab>                
            </mat-tab-group>               
        </ng-template>
    </mat-tab>    
    <!-- ======================================== Subjet2 ======================================== -->
    <mat-tab [class.tabs-overrides] label={{subjectP}}>
        <ng-template matTabContent>
            Content 2
        </ng-template>        
    </mat-tab>  
    <!-- ======================================== Subje3 ======================================== -->  
    <mat-tab [class.tabs-overrides] label={{subjectSW}}>
        <ng-template matTabContent>
            Content 3
        </ng-template>
    </mat-tab>
    <!-- ======================================== Subjet4 ======================================== -->    
    <mat-tab [class.tabs-overrides] label={{subjectSy}}>
        <ng-template matTabContent>
            Content 4
    </ng-template>        
    </mat-tab>    
</mat-tab-group>
