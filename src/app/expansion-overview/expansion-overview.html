<mat-accordion>
  <mat-expansion-panel [expanded]="true">
    <mat-expansion-panel-header>
      <mat-panel-title> SQL </mat-panel-title>
      <!-- <mat-panel-description>
        Currently I am {{panelOpenState() ? 'open' : 'closed'}}
      </mat-panel-description> -->
    </mat-expansion-panel-header>
     <ng-template matExpansionPanelContent>
         <table>
             @for (element of elements; track element; let i = $index){
                 <tr class="tr-border">
                     <td>
                         <a [routerLink]="element.route" [class.abckgd]="element.bckgd" (click)="changeBckgd($event)">{{element.topic}}</a>
                     </td>
                 </tr>
             }
         </table>
     </ng-template>
  </mat-expansion-panel>
</mat-accordion>
