  <mat-accordion>
    
      @if(title===subjectDB){
        
        
        @for (subjt of arrdtsrc; track subjt; let i = $index) {
          <mat-expansion-panel [expanded]=subjt.exp>
                    
          <mat-expansion-panel-header>
              <mat-panel-title> {{subjt.sb}} </mat-panel-title>
          </mat-expansion-panel-header>

          @if(i==0){
          <nav>
            <mat-tree #tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor">
              
              <!-- This is the tree node template for leaf nodes - Children -->  
                <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding [matTreeNodePadding]="0.1">                          
                  <!-- use a disabled button to provide padding for tree leaf -->
                  <button matIconButton disabled></button>              
                    <!-- children -->
                    <a [routerLink]="node.otopic.route" [class.abckgd]="node.otopic.bckgd" (click)="changeBckgd($event)">{{node.otopic.topic}}</a>              
                </mat-tree-node>
                
                <!-- This is the tree node template for Expandable nodes - Fathers-->
                <mat-tree-node *matTreeNodeDef="let node; when: hasChild" [matTreeNodePadding]="0.1" [cdkTreeNodeTypeaheadLabel]="node.name" isExpandable [isExpanded]="true" tabindex="0">
                  <button id="butsql" matIconButton matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
                  <mat-icon class="mat-icon-rtl-mirror">  
                    {{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}                                 
                  </mat-icon>                              
                </button>
                <span >{{node.otopic}}</span> <!-- Header -->     
              </mat-tree-node>            
            </mat-tree>
          </nav>
        }
        </mat-expansion-panel>    
      }  
      }
  </mat-accordion>
