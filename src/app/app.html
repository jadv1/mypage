<head> JADV </head>
<body>
  <div>

    <mat-list-item>Item 1</mat-list-item>
    <mat-divider [vertical]="false"></mat-divider>
    <mat-list-item>Item 2</mat-list-item>
    <mat-divider [vertical]="false"></mat-divider>

  </div>

  <div>      
    <mat-tab-group class="app-toolbar" animationDuration="1000ms">
        <!-- ======================================== Subjet1 ======================================== -->
        <mat-tab>        
            <ng-template mat-tab-label>
                <!-- <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon> -->
                <img src="/css/images/db.svg" alt="foodJpg">
                {{subjectDB}} 
            </ng-template>        
            <ng-template matTabContent>      
                <mat-tab-group class="app-toolbar-sub">
                    <mat-tab label={{subjectFDB}}>
                        <ng-template matTabContent>
                            <mat-grid-list cols="4" rowHeight="50em"> <!-- rowHeight for making the Card height grow -->
                                <mat-grid-tile                                
                                    [colspan]=tiles.getTiles()[3].cols
                                    [rowspan]=tiles.getTiles()[3].rows
                                    [style.background]=tiles.getTiles()[3].color >
                                    
                                        <app-table-contents></app-table-contents>
                                    
                                </mat-grid-tile>
                                <mat-grid-tile id="gidright"
                                    [colspan]=tiles.getTiles()[4].cols
                                    [rowspan]=tiles.getTiles()[4].rows
                                    [style.background]=tiles.getTiles()[4].color >
                                        
                                        <router-outlet></router-outlet>
                                </mat-grid-tile>

                            <!-- @for (tile of tiles.getTiles(); track tile) {
                                <mat-grid-tile
                                    [colspan]="tile.cols"
                                    [rowspan]="tile.rows"
                                    [style.background]="tile.color">
                                        {{tile.text}}                        
                                </mat-grid-tile>
                            } -->

                                
                            </mat-grid-list>                        
                        </ng-template>                                        
                    </mat-tab>
                    <mat-tab label={{subjectDBD}}>
                        <ng-template matTabContent>
                            {{msgprogress}}
                        </ng-template>                       
                    </mat-tab>
                    <mat-tab label={{subjectAMDB}}>
                        <ng-template matTabContent>
                            {{msgprogress}}
                        </ng-template>                       
                    </mat-tab>                
                </mat-tab-group>               
            </ng-template>
        </mat-tab>    
        <!-- ======================================== Subjet2 ======================================== -->
        <mat-tab [class.tabs-overrides] label={{subjectP}}>
            <ng-template matTabContent>
                {{msgprogress}}
            </ng-template>        
        </mat-tab>  
        <!-- ======================================== Subje3 ======================================== -->  
        <mat-tab [class.tabs-overrides] label={{subjectSW}}>
            <ng-template matTabContent>
                {{msgprogress}}
            </ng-template>
        </mat-tab>
        <!-- ======================================== Subjet4 ======================================== -->    
        <mat-tab [class.tabs-overrides] label={{subjectSy}}>
            <ng-template matTabContent>
                {{msgprogress}}
        </ng-template>        
        </mat-tab>    
    </mat-tab-group>

  </div>  
</body>
<footer></footer>
