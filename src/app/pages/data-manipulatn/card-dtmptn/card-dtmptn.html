<mat-card class="card" appearance="outlined">
            <mat-card-header class="m-c-content">
            <!-- <div mat-card-avatar class="card-header-image"></div> -->
            <mat-card-title>
                <mat-card-content class="card-title">
                    <h1>{{topicfunc}}</h1>
                </mat-card-content>
            </mat-card-title>
        </mat-card-header>
        <mat-card-content class="m-c-content">
            <p class="tab1 spacingAfter txtsizesubtitle">{{msgaggre}}</p>
        @for (arr of arrSessions; track arr; let i = $index){            
            <section>
                <h2>{{arr.desc}}</h2>
                @if (arr.desc==arrSessions[0].desc) {
                    <p class="tab1 txtsizesubtitle">{{p_insert1}}</p>
                    <app-aux-func class="sqlcell tab2" [arrstr]="arrqueries1"></app-aux-func>
                }
            </section>
        }            
                
        </mat-card-content>
</mat-card>
