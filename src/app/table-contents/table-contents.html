<table mat-table [dataSource]="dataSource" class="mat-shadow-2">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Name Column -->
  <ng-container matColumnDef="topic">
    <th mat-header-cell *matHeaderCellDef> {{headerTopic}} </th>
    <td mat-cell *matCellDef="let element"> 
        <!-- <a href="#">{{element.topic}}</a>  -->
         <!-- <a [routerLink]="['/join']">{{element.topic}}</a>  -->
          <a [routerLink]="[element.route]">{{element.topic}}</a>
          <!-- @if(element.topic!="Joins"){
            <a [routerLink]="['']">{{element.topic}}</a>
          }
          @else {
            <a [routerLink]="[element.route]">{{element.topic}}</a>
          }          -->
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
